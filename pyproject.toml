[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yashipandey10", email = "yashipandey0203@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "langgraph-cli[inmem]>=0.4.38",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
blogagentic = "blogagentic:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
